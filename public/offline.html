<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#7e1f36" />
    <title>MealBoard sin conexión</title>
    <style>
      body{align-items:center;background:#fcf9f3;color:#282524;display:grid;font-family:Arial,sans-serif;margin:0;min-height:100vh;padding:24px;text-align:center}main{background:white;border:1px solid #e5d9cc;border-radius:28px;box-shadow:0 20px 60px #472f2518;max-width:440px;padding:40px}.mark{background:#7e1f36;border-radius:16px 16px 6px;color:white;display:grid;font:700 32px Georgia;height:64px;margin:auto;place-items:center;width:64px}h1{color:#571425;font-family:Georgia,serif}p{color:#766e68;line-height:1.6}button{background:#7e1f36;border:0;border-radius:12px;color:white;font:700 15px Arial;padding:13px 20px}
    </style>
  </head>
  <body><main><div class="mark">M</div><h1>Estás sin conexión</h1><p>MealBoard necesita internet para iniciar sesión y consultar promociones. Revisá tu conexión e intentá nuevamente.</p><button onclick="location.reload()">Reintentar</button></main></body>
</html>
